name: 每日开奖数据更新

on:
  schedule:
    # 每日北京时间 22:05 / 23:35 / 次日 09:35 各跑一次：开奖 21:15-21:25，
    # 官方接口录入延迟 1-3 小时以上，单次抓取容易扑空导致整天缺最新一期
    - cron: '5 14 * * *'
    - cron: '35 15 * * *'
    - cron: '35 1 * * *'
  workflow_dispatch: {} # 支持在 Actions 页手动触发验证

permissions:
  contents: write

concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 抓取开奖数据
        run: npm run fetch

      # 官方接口偶发迟迟不录入当晚期号时抓取会“无声成功”，这里校验新鲜度，
      # 漏抓则让本任务失败（可收到 Actions 失败通知）
      - name: 校验数据新鲜度
        run: node scripts/check-freshness.mjs

      - name: 数据有变化则提交并推送
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/*.json
          if git diff --cached --quiet; then
            echo "data/*.json 无变化，无需提交"
          else
            git commit -m "chore(data): 同步开奖数据 $(date -u +%F)"
            # Vercel 检测到 main 分支新提交后会自动重新部署
            git push
          fi
