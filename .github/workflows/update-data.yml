name: 每日开奖数据更新

on:
  schedule:
    # 北京时间 22:05 / 23:35 / 次日 01:35 / 09:35 / 12:35 / 15:35 / 18:35 各跑一次：
    # 开奖在 21:15-21:25，官方接口录入延迟从几十分钟到半天以上不等，
    # 多时段兜底保证开奖当天就能补齐最新一期
    - cron: '5 14 * * *'
    - cron: '35 15 * * *'
    - cron: '35 17 * * *'
    - cron: '35 1 * * *'
    - cron: '35 4 * * *'
    - cron: '35 7 * * *'
    - cron: '35 10 * * *'
  workflow_dispatch: {} # 支持在 Actions 页手动触发验证

permissions:
  contents: write

concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 抓取开奖数据
        run: npm run fetch

      # 先提交推送：即使另一彩种数据缺失导致后面的校验失败，
      # 已抓到的数据也要先部署上线
      - name: 数据有变化则提交并推送
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/*.json
          if git diff --cached --quiet; then
            echo "data/*.json 无变化，无需提交"
          else
            git commit -m "chore(data): 同步开奖数据 $(date -u +%F)"
            # Vercel 检测到 main 分支新提交后会自动重新部署
            git push
          fi

      # 官方接口迟迟不录入当晚期号时抓取会“无声成功”，最后校验新鲜度，
      # 漏抓则让本任务失败（可在 Actions 页看到红色失败记录并收到通知）
      - name: 校验数据新鲜度
        run: node scripts/check-freshness.mjs
