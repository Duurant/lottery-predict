name: 每日开奖数据更新

on:
  schedule:
    # 每日北京时间 22:05（UTC 14:05）运行；彩票多在 21:15-21:25 开奖
    - cron: '5 14 * * *'
  workflow_dispatch: {} # 支持在 Actions 页手动触发验证

permissions:
  contents: write

concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 抓取开奖数据
        run: npm run fetch

      - name: 数据有变化则提交并推送
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/*.json
          if git diff --cached --quiet; then
            echo "data/*.json 无变化，无需提交"
          else
            git commit -m "chore(data): 同步开奖数据 $(date -u +%F)"
            # Vercel 检测到 main 分支新提交后会自动重新部署
            git push
          fi
